[package]
name = "rusty-watch-from-scratch"
version = "0.1.0"
authors = ["alexey"]
edition = "2021"
resolver = "2"
rust-version = "1.82"

[[bin]]
name = "rusty-watch-from-scratch"
harness = false # do not use the built-in cargo test harness -> resolve rust-analyzer errors

[profile.release]
opt-level = "s"
panic = "unwind"

[profile.dev]
panic = "unwind"
debug = true    # Symbols are nice, and they don't increase the size on Flash
opt-level = "z"
[patch.crates-io]
esp-idf-sys = { git = "https://github.com/esp-rs/esp-idf-sys.git" }
esp-idf-hal = { git = "https://github.com/esp-rs/esp-idf-hal.git" }
esp-idf-svc = { git = "https://github.com/esp-rs/esp-idf-svc.git" }

[dependencies]
log = "0.4"
esp-idf-svc = { version = "0.52.1", features = ["critical-section", "embassy-time-driver", "embassy-sync", "panic_handler"] }
# Remove `generic-queue-8` if you plan to use `embassy-time` WITH `embassy-executor`
embassy-time = { version = "0.5", features = ["generic-queue-8"] }
esp-idf-hal = "0.46.2"
gc9a01-rs = "0.3.1"
embedded-graphics = "0.8.2"
embedded-hal = "1.0.0"
display-interface-spi = "0.5.0"
cst816s = "1.0.1"
anyhow = "1.0.102"
chrono = "0.4.44"
chrono-tz = "0.10.4"

[build-dependencies]
dotenvy = "0.15.7"
embuild = "0.33"
